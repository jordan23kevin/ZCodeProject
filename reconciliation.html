<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temu 对账</title>
<style>
:root{--bg:#050810;--panel:#0c1220;--panel2:#111a2b;--line:#1a2540;--text:#dbe4f3;--dim:#7d8daa;--accent:#22d3ee;--ok:#34d399;--warn:#fbbf24;--err:#f87171}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding:18px}.container{max-width:1600px;margin:auto}a{color:var(--accent);text-decoration:none}h1{font-size:22px}h2{font-size:16px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.top a{font-size:13px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim)}input[type=date]{background:#070c16;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px}.btn{background:var(--ok);color:#04121a;border:1px solid var(--ok);font-weight:600;border-radius:6px;padding:8px 16px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.btn-secondary{background:var(--panel2);color:var(--text);border-color:var(--line)}.check{display:flex;align-items:center;gap:6px;font-size:13px;padding-bottom:8px}.check input{accent-color:var(--accent)}.badge{display:inline-block;padding:4px 12px;border-radius:12px;font-size:12px;border:1px solid var(--line)}.running{color:var(--warn)}.completed{color:var(--ok)}.error{color:var(--err)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#070c16;border:1px solid var(--line);border-radius:8px;padding:14px}.card .label{font-size:12px;color:var(--dim);margin-bottom:8px}.card .value{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}.pos{color:var(--ok)}.neg{color:var(--err)}.muted{color:var(--dim);font-size:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}th{color:var(--dim);font-weight:500}th:first-child,td:first-child{text-align:left}td:nth-child(2),td:nth-child(3){text-align:left}tr.total td{font-weight:700;background:#0e1828}.notes td:first-child{width:70px}.notes td:nth-child(2){width:260px}pre{white-space:pre-wrap;word-break:break-word;background:#070c16;border:1px solid var(--line);border-radius:6px;padding:12px;max-height:300px;overflow:auto;color:var(--dim);font-size:12px}.hidden{display:none}.actions{display:flex;gap:10px;align-items:center}.small{font-size:12px}
</style>
</head>
<body>
<div class="container">
  <div class="top"><h1>Temu 对账</h1><a href="/">← 返回工作台</a></div>
  <section class="panel">
    <div class="controls">
      <label class="field">开始日期<input id="start" type="date" value="2026-04-01"></label>
      <label class="field">结束日期<input id="end" type="date"></label>
      <label class="check"><input id="refresh" type="checkbox" checked>先刷新平台数据</label>
      <button id="run" class="btn" onclick="startRun()">开始对账</button>
      <button id="stop" class="btn btn-secondary" onclick="stopRun()" disabled>停止对账</button>
      <span id="status" class="badge">未运行</span>
    </div>
  </section>
  <section class="cards" id="cards"></section>
  <section class="panel" style="margin-top:16px">
    <h2>月度汇总</h2>
    <div style="overflow:auto"><table id="monthly"><thead><tr><th>月份</th><th>已到账净额</th><th>未到账净额</th><th>已到账成本</th><th>未到账成本</th><th>未到账直接费用</th><th>退货费暂估</th><th>已到账利润</th><th>未到账利润</th><th>总利润</th></tr></thead><tbody></tbody></table></div>
  </section>
  <section class="panel">
    <h2>财务注意事项</h2>
    <table class="notes"><thead><tr><th>级别</th><th>事项</th><th>说明</th></tr></thead><tbody id="notes"></tbody></table>
  </section>
  <section class="panel">
    <h2>历史记录</h2>
    <table><thead><tr><th>对账时间</th><th>已到账利润</th><th>未到账利润</th><th>总利润</th><th>状态</th></tr></thead><tbody id="history"></tbody></table>
  </section>
  <section class="panel"><h2>运行日志</h2><pre id="log">尚未开始</pre></section>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const amount=v=>Number(v||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const cls=v=>Number(v||0)<0?'neg':'pos';
async function api(url,options){const r=await fetch(url,options);const j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||j.error_msg||`请求失败 ${r.status}`);return j}
function render(report){
  const totals=report.totals||{};
  const cards=[['已到账净额',totals.actual_net],['未到账净额',totals.pending_net],['已到账利润',totals.settled_profit],['未到账利润',totals.pending_profit],['总利润',totals.total_profit]];
  $('cards').innerHTML=cards.map(([label,value])=>`<div class="card"><div class="label">${label}</div><div class="value ${cls(value)}">${amount(value)} 元</div></div>`).join('');
  const rows=(report.months||[]).concat(report.totals?[report.totals]:[]);
  const keys=['month','actual_net','pending_net','settled_cost','pending_cost','pending_direct_fees','estimated_fees','settled_profit','pending_profit','total_profit'];
  document.querySelector('#monthly tbody').innerHTML=rows.map(row=>`<tr class="${row.month==='合计'?'total':''}">${keys.map((key,i)=>i===0?`<td>${esc(row[key])}</td>`:`<td class="${cls(row[key])}">${amount(row[key])}</td>`).join('')}</tr>`).join('');
  $('notes').innerHTML=(report.notes||[]).map(n=>`<tr><td class="${n.level==='error'?'neg':n.level==='warn'?'muted':'pos'}">${esc(n.level)}</td><td>${esc(n.title)}</td><td>${esc(n.detail)}</td></tr>`).join('');
}
function renderHistory(items){
  $('history').innerHTML=items.map(row=>`<tr><td>${esc(row.created_at)}</td><td class="${cls(row.settled_profit)}">${amount(row.settled_profit)}</td><td class="${cls(row.pending_profit)}">${amount(row.pending_profit)}</td><td class="${cls(row.total_profit)}">${amount(row.total_profit)}</td><td>${esc(row.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">暂无历史记录</td></tr>';
}
async function loadInitial(){
  const [latest,history]=await Promise.all([api('/api/reconciliation/latest'),api('/api/reconciliation/history')]);
  render(latest.report);renderHistory(history.items||[]);
}
async function startRun(){
  $('run').disabled=true;$('status').className='badge running';$('status').textContent='对账中';
  $('log').textContent='任务已启动...';
  try{
    await api('/api/reconciliation/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({start:$('start').value||null,end:$('end').value||null,refresh:$('refresh').checked})});
    poll();
  }catch(e){$('status').className='badge error';$('status').textContent='启动失败';$('log').textContent=e.message;$('run').disabled=false}
}
async function stopRun(){
  $('stop').disabled=true;
  try{ await api('/api/reconciliation/stop',{method:'POST'}); $('status').textContent='停止中...'; }
  catch(e){ $('log').textContent=e.message; }
}
async function poll(){
  try{
    const j=await api('/api/reconciliation/status');
    $('log').textContent=(j.log||[]).join('\n');
    if(j.status==='running'){$('status').className='badge running';$('status').textContent='对账中';$('run').disabled=true;$('stop').disabled=false;setTimeout(poll,2500);return}
    $('run').disabled=false;$('stop').disabled=true;
    if(j.status==='stopped'){
      $('status').className='badge running';$('status').textContent='已停止';
    }else if(j.status==='completed'){
      $('status').className='badge completed';$('status').textContent='对账完成';
      if(j.report)render(j.report);
      const h=await api('/api/reconciliation/history');renderHistory(h.items||[]);
    }else if(j.status==='error'){
      $('status').className='badge error';$('status').textContent='对账失败';
      if(j.error)$('log').textContent+='\n'+j.error;
    }
  }catch(e){$('status').className='badge error';$('status').textContent='状态读取失败';$('log').textContent=e.message;$('run').disabled=false;$('stop').disabled=true}
}
$('end').value=new Date().toISOString().slice(0,10);
loadInitial().catch(e=>$('log').textContent=e.message);
</script>
</body>
</html>
