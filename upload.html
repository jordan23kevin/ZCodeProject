<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WB 上款 — 03_UPLOAD 批量上传 v2.5.3</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#1a1a1a;color:#eee;padding:22px}
  h1{text-align:center;font-size:32px;margin:0 0 16px}
  h1 .v{font-size:15px;color:#666;font-weight:normal;margin-left:8px}
  .toolbar{text-align:center;margin-bottom:18px;position:sticky;top:0;background:#1a1a1a;padding:12px 0;z-index:20;border-bottom:1px solid #333;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
  .toolbar input,.toolbar select{padding:11px 16px;font-size:16px;border-radius:5px;border:1px solid #555;background:#2a2a2a;color:#eee}
  .toolbar button{padding:11px 20px;font-size:16px;cursor:pointer;background:#2196F3;color:#fff;border:none;border-radius:5px;font-weight:600}
  .toolbar button:hover{background:#1976D2}
  .toolbar button:disabled{opacity:.45;cursor:not-allowed}
  .toolbar label{color:#eee;cursor:pointer;user-select:none;font-size:16px}
  .btn-upload{background:#4CAF50 !important}
  .btn-upload:hover:not(:disabled){background:#388e3c !important}
  .toolbar .cnt{color:#aaa;font-size:15px}

  .progress-panel{display:none;background:#252525;border:1px solid #444;border-radius:10px;padding:16px 20px;margin:0 auto 22px;max-width:1200px}
  .progress-panel.active{display:block}
  .progress-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:10px}
  .progress-title{font-size:18px;font-weight:700}
  .progress-meta{font-size:14px;color:#bbb;white-space:nowrap}
  .progress-bar-wrap{width:100%;height:22px;background:#333;border-radius:11px;overflow:hidden;margin-top:6px}
  .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#4CAF50,#8BC34A);transition:width .4s ease}
  .progress-detail{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:#bbb}

  .section-title{font-size:22px;font-weight:700;margin:26px 0 14px;padding-bottom:8px;border-bottom:2px solid #333}
  .section-title .sub{font-size:14px;color:#888;font-weight:normal;margin-left:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;max-width:2500px;margin:0 auto}
  .card{background:#1e1e1e;border-radius:12px;border:1px solid #333;overflow:hidden}
  .card.completed{opacity:.72;border-color:#2e4a2e}
  .card-head{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#252525;border-bottom:1px solid #333}
  .dx-check{width:20px;height:20px;accent-color:#4CAF50;cursor:pointer}
  .dxname{font-weight:800;font-size:20px;color:#4CAF50;letter-spacing:.3px;cursor:pointer}
  .dxname:hover{text-decoration:underline}
  .pcount{color:#888;font-size:14px;margin-left:auto}
  .up-gallery{padding:12px 14px 8px}
  /* v2.5.3 展开=原位展开（卡不挪位），卡内两行横向图流 */
  .up-gallery-flow{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:140px;gap:12px;overflow-x:auto;padding:6px 2px 10px}
  .up-item{display:flex;flex-direction:column;align-items:center}
  .up-thumb{width:100%;aspect-ratio:4/5;height:auto;border-radius:8px;overflow:hidden;background:#fff;cursor:pointer;position:relative;border:1px solid #333}
  .up-thumb .thumb-badge{position:absolute;top:4px;left:4px;font-size:12px;padding:1px 7px;border-radius:4px;z-index:5;opacity:.92}
  .up-thumb img{width:100%;height:100%;object-fit:contain;transition:transform .15s;display:block}
  .up-thumb:hover img{transform:scale(1.05)}
  .up-thumb .del-overlay{position:absolute;top:4px;right:4px;width:26px;height:26px;background:#e53935;color:#fff;border:none;border-radius:4px;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}
  .up-thumb .del-overlay:hover{background:#b71c1c}
  .up-item.deleted{opacity:.3}
  .up-label{color:#aaa;font-size:15px;margin-top:7px;text-align:center;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{display:inline-block;font-size:13px;font-weight:bold;padding:3px 9px;border-radius:4px;margin-right:5px}
  .badge-bw{background:#9c27b0;color:#fff}
  .badge-b{background:#555;color:#fff}
  .badge-w{background:#e0e0e0;color:#333}
  .badge-other{background:#424242;color:#fff}
  .empty{text-align:center;color:#888;margin-top:40px;font-size:17px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:14px 26px;border-radius:8px;font-size:16px;display:none;z-index:999;max-width:80%}
  .preview{position:fixed;z-index:9999;pointer-events:none;display:none;max-width:900px;max-height:90vh;border:2px solid #555;border-radius:8px;box-shadow:0 4px 25px rgba(0,0,0,.85);background:#000}
  .preview img{display:block;max-width:900px;max-height:90vh;object-fit:contain}

  /* ---- v2.5.0 紧凑卡片：封面 + 色点 + 操作 ---- */
  .card-cover{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;background:#fff;cursor:zoom-in}
  .card-cover img{width:100%;height:100%;object-fit:contain;transition:transform .2s;display:block}
  .card-cover:hover img{transform:scale(1.03)}
  .card-cover .cover-count{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.68);color:#fff;font-size:13px;padding:3px 10px;border-radius:11px}
  .card-cover .cover-empty{display:flex;align-items:center;justify-content:center;height:100%;color:#bbb;font-size:15px}
  .color-dots{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0}
  .color-dot{width:15px;height:15px;border-radius:50%;border:1px solid #666}
  .card-actions{display:flex;gap:8px;padding:10px 14px 14px}
  .card-actions button{flex:1;padding:9px 0;font-size:15px;border:1px solid #555;background:#2a2a2a;color:#eee;border-radius:6px;cursor:pointer}
  .card-actions button:hover{background:#3a3a3a}
  .card-actions .btn-review{background:#2196F3;border-color:#2196F3;color:#fff;font-weight:600}
  .card-actions .btn-review:hover{background:#1976D2}

  /* ---- v2.5.0 全屏审图模式 ---- */
  .reviewer{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:10000;display:none;flex-direction:column}
  .reviewer.active{display:flex}
  .rev-top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid #333;flex:none}
  .rev-dx{font-weight:800;font-size:20px;color:#4CAF50;letter-spacing:.3px}
  .rev-name{font-size:15px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .rev-count{font-size:15px;color:#888;white-space:nowrap}
  .rev-del{padding:7px 14px;font-size:14px;background:#5d2626;color:#ffb4b4;border:1px solid #8a3a3a;border-radius:6px;cursor:pointer;white-space:nowrap}
  .rev-del:hover{background:#7a2f2f}
  .rev-close{padding:7px 14px;font-size:16px;background:#333;color:#eee;border:1px solid #555;border-radius:6px;cursor:pointer}
  .rev-close:hover{background:#444}
  .rev-main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;padding:8px 70px}
  /* v2.5.3 审图一屏 3 张 */
  .rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;height:100%;align-items:center}
  .rev-slot{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;height:100%}
  .rev-slot img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 4px 30px rgba(0,0,0,.7)}
  .rev-slot .rev-del{position:absolute;top:6px;right:6px;z-index:5}
  .rev-slot .rev-cap{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.68);color:#fff;font-size:12px;padding:2px 8px;border-radius:9px;z-index:5;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rev-arrow{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:84px;font-size:40px;line-height:1;background:rgba(255,255,255,.08);color:#eee;border:none;border-radius:8px;cursor:pointer;user-select:none}
  .rev-arrow:hover{background:rgba(255,255,255,.2)}
  .rev-arrow.left{left:10px}
  .rev-arrow.right{right:10px}
  .rev-strip{flex:none;display:flex;gap:8px;overflow-x:auto;padding:10px 16px 14px;border-top:1px solid #333;background:rgba(255,255,255,.03)}
  .rev-thumb{width:64px;height:80px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.55;border:2px solid transparent;flex:none;background:#fff}
  .rev-thumb:hover{opacity:.85}
  .rev-thumb.active{opacity:1;border-color:#2196F3}
</style>
</head>
<body>
<h1>WB 上款 <span class="v">v2.5.3</span></h1>
<div class="toolbar">
  <select id="dateSel" onchange="switchDate(this.value)">
    <option value="">全部日期</option>
  </select>
  <input id="search" placeholder="搜索 DX号…" oninput="filterCards()">
  <button onclick="filterCards()">🔍 搜索</button>
  <button onclick="refreshAll()">🔄 刷新</button>
  <button onclick="refreshOnlineListed()" id="refreshOnlineBtn">🌐 刷新已上款</button>
  <button onclick="deepCleanOnlineListed()" id="deepCleanBtn" title="翻完所有页全量覆盖，准确移除已下架款（较慢，约2分钟）">🧹 深度清理</button>
  <button onclick="copyPendingSkus()" id="copyPendingBtn" title="复制当前未上款列表中的所有款号">📋 复制未上款</button>
  <label>
    <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)" style="width:20px;height:20px;accent-color:#4CAF50;vertical-align:middle;"> 全选
  </label>
  <label>
    <input type="checkbox" id="forceReupload" style="width:20px;height:20px;accent-color:#ff9800;vertical-align:middle;"> 强制重新上款
  </label>
  <button class="btn-upload" onclick="batchUpload()" id="uploadBtn" disabled>📤 批量上传 (0)</button>
  <button onclick="openRecycleBin()" title="打开系统回收站" style="background:#607d8b;">🗑 回收站</button>
  <span class="cnt" id="cnt">0 款</span>
</div>

<div id="progressPanel" class="progress-panel">
  <div class="progress-row">
    <span class="progress-title" id="progressTitle">上款进度</span>
    <span class="progress-meta" id="progressMeta">0 / 0</span>
  </div>
  <div class="progress-bar-wrap"><div id="progressBar" class="progress-bar"></div></div>
  <div class="progress-detail">
    <span id="progressCurrent">当前：-</span>
    <span id="progressElapsed">已用：-</span>
    <span id="progressAvg">平均：-</span>
    <span id="progressEta">预计剩余：-</span>
    <span id="progressOnline">在线已验证：-</span>
  </div>
</div>

<div id="pendingSection" style="display:none">
  <div class="section-title">未上款 <span class="sub" id="pendingSub"></span></div>
  <div class="grid" id="pendingGrid"></div>
</div>

<div id="completedSection" style="display:none">
  <div class="section-title">已上款 <span class="sub" id="completedSub"></span></div>
  <div class="grid" id="completedGrid"></div>
</div>

<div id="emptyState"><p class="empty">加载中…</p></div>

<div id="toast" class="toast"></div>
<div id="preview" class="preview"><img id="previewImg" src=""></div>

<!-- v2.5.0 全屏审图模式 -->
<div id="reviewer" class="reviewer">
  <div class="rev-top">
    <span id="revDx" class="rev-dx"></span>
    <span id="revBadge" class="badge"></span>
    <span id="revName" class="rev-name"></span>
    <span id="revCount" class="rev-count"></span>
    <button class="rev-close" onclick="closeReviewer()" title="关闭 (Esc)">✕</button>
  </div>
  <div class="rev-main">
    <button class="rev-arrow left" onclick="revStep(-1)" title="上 3 张 (←)">‹</button>
    <div class="rev-grid" id="revGrid"></div>
    <button class="rev-arrow right" onclick="revStep(1)" title="下 3 张 (→)">›</button>
  </div>
  <div class="rev-strip" id="revStrip"></div>
</div>

<script>
// 品类透传：T恤=wb（URL 无参数，行为不变）；卫衣=hoodie（?cat=hoodie，所有 API 带上；
// 卫衣缺 listing profile 时后端会返回明确错误并在此展示）
var CAT=(function(){var c=new URLSearchParams(location.search).get('cat');return c==='hoodie'?'hoodie':'wb';})();
var IS_HOODIE=(CAT==='hoodie');
function withCat(url){if(!IS_HOODIE)return url;return url+(url.indexOf('?')>=0?'&':'?')+'cat='+CAT;}
if(IS_HOODIE){
  document.addEventListener('DOMContentLoaded',function(){
    document.title=document.title+'（卫衣）';
    var h1=document.querySelector('h1');
    if(h1&&h1.textContent.indexOf('卫衣')<0)h1.textContent=h1.textContent+' · 🧥 卫衣';
  });
}

function showToast(m){
  var t=document.getElementById('toast');
  t.textContent=m;t.style.display='block';
  setTimeout(function(){t.style.display='none';},3500);
}

function copyDx(dx){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(dx).then(function(){showToast('已复制 '+dx);}).catch(function(){showToast('复制失败，请手动复制');});
  }else{
    var ta=document.createElement('textarea');
    ta.value=dx;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');showToast('已复制 '+dx);}catch(e){showToast('复制失败');}
    document.body.removeChild(ta);
  }
}

function delUploadImg(btn,dx,file){
  if(!confirm('删除 '+dx+'/'+file+' ？（送回收站，可撤销）'))return;
  fetch(withCat('/api/upload/delete'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dx:dx,file:file})})
    .then(function(r){return r.json();})
    .then(function(d){
      showToast(d.msg||d.error||'未知结果');
      if(d.ok){
        var item=btn.closest('.up-item');
        if(item) item.classList.add('deleted');
      }
    }).catch(function(e){showToast('❌ 请求失败: '+e);});
}

function openRecycleBin(){
  fetch('/api/open/recycle').then(function(r){return r.json();}).then(function(d){
    if(d.ok){
      showToast('🗑 已打开回收站');
    }else{
      showToast('❌ '+(d.error||'打开失败'));
    }
  }).catch(function(){showToast('❌ 打开回收站请求失败');});
}

var allProjects=[];
var progressData=null;
var pollTimer=null;
var currentPending=[];

function loadProjects(){
  document.getElementById('pendingGrid').innerHTML='<p class="empty">加载中…</p>';
  document.getElementById('completedGrid').innerHTML='<p class="empty">加载中…</p>';
  fetch(withCat('/api/upload/projects')).then(function(r){return r.json();}).then(function(d){
    if(d.ok===false&&d.error){
      document.getElementById('emptyState').innerHTML='<p class="empty">⚠️ '+d.error+'</p>';
      return;
    }
    allProjects=d.projects||[];
    fillDateSel();
    return loadProgress();
  }).then(function(){
    renderCards();
  }).catch(function(e){
    document.getElementById('emptyState').innerHTML='<p class="empty">加载失败: '+e+'</p>';
  });
}

function loadProgress(){
  return fetch(withCat('/api/upload/progress')).then(function(r){return r.json();}).then(function(d){
    progressData=d||{};
    updateProgressPanel();
  }).catch(function(e){console.log('progress load failed',e);});
}

function fillDateSel(){
  var sel=document.getElementById('dateSel');
  var dates={};
  allProjects.forEach(function(p){if(p.date)dates[p.date]=1;});
  var sortedDates=Object.keys(dates).sort().reverse();
  var opts=['<option value="">全部日期</option>'];
  sortedDates.forEach(function(dt){
    opts.push('<option value="'+dt+'">20'+dt.substr(0,2)+'-'+dt.substr(2,2)+'-'+dt.substr(4,2)+'</option>');
  });
  sel.innerHTML=opts.join('');
  if(sortedDates.length>0){
    sel.value=sortedDates[0];
  }
}

// 卫衣（hoodie）10 色顺序（与后端 wb_listing._HOODIE_COLOR_TO_DXM 一致）
var HOODIE_COLORS=['白','黑','蜜瓜橙','浅黄色','蓝绿色','宝蓝色','孔雀蓝','明黄色','草绿色','粉红色'];

function upGroup(name,dx){
  var stem=name.replace(/\.[^.]+$/,'');
  if(IS_HOODIE){
    // 卫衣：按颜色分组（同色模特+平铺并排一行，每行 2 张），T恤 走下方 BW/B/W 逻辑
    var body=stem.indexOf(dx+'_')===0?stem.substr(dx.length+1):stem;
    for(var i=0;i<HOODIE_COLORS.length;i++){
      if(body.indexOf(HOODIE_COLORS[i])>=0)return HOODIE_COLORS[i];
    }
    return '其他';
  }
  if(stem.indexOf('BW')>=0)return 'BW';
  if(stem.indexOf(dx+'_B_')===0||stem.endsWith('_B'))return 'B';
  if(stem.indexOf(dx+'_W_')===0||stem.endsWith('_W'))return 'W';
  return '其他';
}
function upLabel(name,dx){
  var stem=name.replace(/\.[^.]+$/,'');
  var label=stem.indexOf(dx+'_')===0?stem.substr(dx.length+1):stem;
  label=label.replace(/^(B|W)_/,'').replace(/_?(BW)$/,'').replace(/_/g,' ').trim();
  return label||'成品';
}

function formatDuration(sec){
  if(!sec && sec!==0)return '-';
  if(sec<60)return sec+'s';
  var m=Math.floor(sec/60), s=sec%60;
  if(m<60)return m+'m '+s+'s';
  var h=Math.floor(m/60); m=m%60;
  return h+'h '+m+'m';
}

// v2.5.0 颜色圆点配色（卫衣 10 色 + T恤 BW/B/W + 其他）
var DOT_COLORS={'白':'#f5f5f5','黑':'#222','蜜瓜橙':'#f4a259','浅黄色':'#f0e39a','蓝绿色':'#5bc0be',
  '宝蓝色':'#3a6ea5','孔雀蓝':'#0f4c81','明黄色':'#ffd23f','草绿色':'#7fb069','粉红色':'#f48fb1',
  'BW':'#9c27b0','B':'#222','W':'#f5f5f5','其他':'#757575'};
// 每款文件列表全局缓存（审图模式数据源；renderCards 每次重建）
var DX_FILES={};
// v2.5.2 当前页面款号顺序（renderCards 重建；审图跨款翻页用）
var DX_ORDER=[];
// v2.5.1 封面颜色轮换：renderCards 重建时归零，buildCard 每卡递增
var _renderSeq=0;

function buildCard(p){
  var files=(p.files||[]);
  DX_FILES[p.dx]=files;
  var groups={};
  files.forEach(function(f){
    var g=upGroup(f.name,p.dx);
    if(!groups[g])groups[g]=[];
    groups[g].push(f);
  });
  var order=IS_HOODIE?HOODIE_COLORS.concat(['其他']):['BW','B','W','其他'];
  // v2.5.1 展开区：按颜色顺序平铺成"两行横向大图流"，每图左上角带色徽
  var items=[];
  order.forEach(function(g){
    if(!groups[g])return;
    var cls={'BW':'badge-bw','B':'badge-b','W':'badge-w'}[g]||'badge-other';
    groups[g].forEach(function(f){
      var ts=f.thumb_mtime || f.mtime;
      var origTs=f.mtime;
      var safeFile=f.name.replace(/'/g,"\\'");
      var fIdx=files.indexOf(f);
      items.push('<div class="up-item'+(f._deleted?' deleted':'')+'">'
        +'<div class="up-thumb cell" data-src="'+withCat('/api/upload/original?dx='+p.dx+'&file='+encodeURIComponent(f.name)+'&t='+origTs)+'" onclick="openReviewer(\''+p.dx+'\','+fIdx+')" title="点击进入审图模式">'
        +'<span class="thumb-badge badge '+cls+'">'+g+'</span>'
        +'<button class="del-overlay" onclick="event.stopPropagation();delUploadImg(this,\''+p.dx+'\',\''+safeFile+'\')" title="删除成品图">×</button>'
        +'<img src="'+withCat('/api/upload/thumb?dx='+p.dx+'&file='+encodeURIComponent(f.name)+'&t='+ts)+'" loading="lazy" decoding="async" onerror="this.onerror=null;this.src=\'/api/upload/original?dx='+p.dx+'&file=\'+encodeURIComponent(\''+safeFile+'\')+\'&t='+origTs+(IS_HOODIE?'&cat=hoodie':'')+'\'">'
        +'</div>'
        +'<div class="up-label" title="'+f.name+'">'+upLabel(f.name,p.dx)+'</div>'
        +'</div>');
    });
  });
  var doneInfo='';
  if(progressData && progressData.per_dx && progressData.per_dx[p.dx] && progressData.per_dx[p.dx].duration){
    doneInfo=' <span style="color:#8bc34a;font-size:13px">('+formatDuration(progressData.per_dx[p.dx].duration)+')</span>';
  }
  var onlineBadge = p.online_listed
    ? ' <span style="background:#4caf50;color:#fff;padding:2px 8px;border-radius:10px;font-size:12px;margin-left:8px;">✓ 在线</span>'
    : '';
  // v2.5.1 封面：按卡片序号轮换颜色组，不再全是第一张（避免整屏同色）
  var cover=null;
  var gKeys=order.filter(function(g){return groups[g]&&groups[g].some(function(f){return !f._deleted;});});
  if(gKeys.length){
    var cg=groups[gKeys[_renderSeq%gKeys.length]];
    for(var ci=0;ci<cg.length;ci++){if(!cg[ci]._deleted){cover=cg[ci];break;}}
  }
  if(!cover){for(var ci2=0;ci2<files.length;ci2++){if(!files[ci2]._deleted){cover=files[ci2];break;}}}
  _renderSeq++;
  var coverHtml;
  if(cover){
    var cts=cover.thumb_mtime||cover.mtime;
    var coverIdx=files.indexOf(cover);
    coverHtml='<div class="card-cover" onclick="openReviewer(\''+p.dx+'\','+coverIdx+')" title="点击进入审图模式">'
      +'<img src="'+withCat('/api/upload/thumb?dx='+p.dx+'&file='+encodeURIComponent(cover.name)+'&t='+cts)+'" loading="lazy" decoding="async">'
      +'<span class="cover-count">'+files.length+' 张</span>'
      +'</div>';
  }else{
    coverHtml='<div class="card-cover"><div class="cover-empty">03_UPLOAD 为空</div></div>';
  }
  // 颜色圆点：一眼看到哪些色有图
  var dots=order.filter(function(g){return groups[g];}).map(function(g){
    return '<span class="color-dot" style="background:'+(DOT_COLORS[g]||'#757575')+'" title="'+g+' '+groups[g].length+'张"></span>';
  }).join('');
  return '<div class="card" data-dx="'+p.dx+'" id="card-'+p.dx+'">'
    +'<div class="card-head">'
    +'<input type="checkbox" class="dx-check" data-dx="'+p.dx+'" onchange="updateUploadBtn()">'
    +'<span class="dxname" onclick="copyDx(\''+p.dx+'\')" title="点击复制款号">'+p.dx+'</span>'
    +onlineBadge
    +'<span class="pcount">'+(p.files?p.files.length:0)+' 张'+doneInfo+'</span>'
    +'</div>'
    +coverHtml
    +(dots?'<div class="color-dots">'+dots+'</div>':'')
    +'<div class="card-actions">'
    +'<button class="btn-review" onclick="openReviewer(\''+p.dx+'\',0)">🔍 审图</button>'
    +'<button onclick="toggleGallery(\''+p.dx+'\',this)">▸ 展开</button>'
    +'<button onclick="openDxFolder(\''+p.dx+'\')" title="打开 '+p.dx+'/03_UPLOAD 文件夹">📂</button>'
    +'</div>'
    +'<div class="up-gallery" id="gal-'+p.dx+'" style="display:none"><div class="up-gallery-flow">'+(items.length?items.join(''):'<p class="empty">03_UPLOAD 为空</p>')+'</div></div>'
    +'</div>';
}

/* ---- v2.5.0 全屏审图模式 ---- */
var revState={dx:null,idx:0};
function revFiles(){
  return (DX_FILES[revState.dx]||[]).filter(function(f){return !f._deleted;});
}
function openReviewer(dx,fIdx){
  revState.dx=dx;
  var all=DX_FILES[dx]||[];
  var list=revFiles();
  if(!list.length){showToast('该款没有可审阅的图片');return;}
  var idx=0;
  if(fIdx>0 && all[fIdx]){
    var pos=list.indexOf(all[fIdx]);
    if(pos>=0)idx=pos;
  }
  revState.idx=Math.floor(idx/3)*3;   // v2.5.3 一屏3张：对齐到当前组起始
  renderReviewer();
  document.getElementById('reviewer').classList.add('active');
}
function closeReviewer(){
  revState.dx=null;
  document.getElementById('reviewer').classList.remove('active');
  document.getElementById('revGrid').innerHTML='';
}
// v2.5.2 跨款移动：返回下/上一个有图款的 dx，到尽头返回 null
function revJump(d){
  var pos=DX_ORDER.indexOf(revState.dx);
  if(pos<0)return null;
  var i=pos+d;
  while(i>=0&&i<DX_ORDER.length){
    var dx=DX_ORDER[i];
    if((DX_FILES[dx]||[]).some(function(f){return !f._deleted;}))return dx;
    i+=d;
  }
  return null;
}
// v2.5.3 d=±1 表示翻一组（3张）；越过本款边界跨款：右=下一款第1组，左=上一款最后一组
function revStep(d){
  var list=revFiles();
  if(!list.length)return;
  var ni=revState.idx+d*3;
  if(ni>=0&&ni<list.length){revState.idx=ni;renderReviewer();return;}
  var nd=revJump(d);
  if(!nd){showToast(d>0?'已经是最后一款的图了':'已经是第一款的图了');return;}
  revState.dx=nd;
  var nl=revFiles().length;
  revState.idx=d>0?0:Math.floor((nl-1)/3)*3;
  renderReviewer();
}
function revGo(i){revState.idx=Math.floor(i/3)*3;renderReviewer();}
function renderReviewer(){
  var list=revFiles();
  if(!list.length){closeReviewer();return;}
  if(revState.idx>=list.length)revState.idx=Math.floor((list.length-1)/3)*3;
  if(revState.idx<0)revState.idx=0;
  var dx=revState.dx;
  var trio=list.slice(revState.idx,revState.idx+3);
  var f=trio[0];
  document.getElementById('revDx').textContent=dx;
  var g=upGroup(f.name,dx);
  var badge=document.getElementById('revBadge');
  badge.textContent=g;
  badge.className='badge '+({'BW':'badge-bw','B':'badge-b','W':'badge-w'}[g]||'badge-other');
  document.getElementById('revName').textContent=trio.map(function(it){return upLabel(it.name,dx);}).join('　');
  document.getElementById('revCount').textContent=(revState.idx+1)+'-'+Math.min(revState.idx+3,list.length)+' / '+list.length;
  var ghtml=trio.map(function(it,k){
    var safeFile=it.name.replace(/'/g,"\\'");
    return '<div class="rev-slot">'
      +'<img src="'+withCat('/api/upload/original?dx='+dx+'&file='+encodeURIComponent(it.name)+'&t='+it.mtime)+'">'
      +'<button class="rev-del" onclick="revDelete('+k+')" title="删除 '+it.name+'（送回收站，可撤销）">×</button>'
      +'<span class="rev-cap">'+upLabel(it.name,dx)+'</span>'
      +'</div>';
  }).join('');
  document.getElementById('revGrid').innerHTML=ghtml;
  var html=list.map(function(it,i){
    var ts=it.thumb_mtime||it.mtime;
    var act=(i>=revState.idx&&i<revState.idx+3)?' active':'';
    return '<img class="rev-thumb'+act+'" src="'
      +withCat('/api/upload/thumb?dx='+dx+'&file='+encodeURIComponent(it.name)+'&t='+ts)
      +'" onclick="revGo('+i+')" loading="lazy" title="'+it.name+'">';
  }).join('');
  var strip=document.getElementById('revStrip');
  strip.innerHTML=html;
  var cur=strip.children[revState.idx];
  if(cur&&cur.scrollIntoView)cur.scrollIntoView({inline:'center',block:'nearest'});
}
// v2.5.3 删除当前屏第 sub 张（0~2）
function revDelete(sub){
  var list=revFiles();
  var f=list[revState.idx+(sub||0)];
  if(!f)return;
  var dx=revState.dx;
  if(!confirm('删除 '+dx+'/'+f.name+' ？（送回收站，可撤销）'))return;
  fetch(withCat('/api/upload/delete'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dx:dx,file:f.name})})
    .then(function(r){return r.json();})
    .then(function(d){
      showToast(d.msg||d.error||'未知结果');
      if(d.ok){
        f._deleted=true;   // 本地标记，审图继续；展开视图下次渲染时也会带上 deleted 样式
        renderReviewer();
      }
    }).catch(function(e){showToast('❌ 请求失败: '+e);});
}
document.addEventListener('keydown',function(e){
  if(!revState.dx)return;
  if(e.key==='Escape')closeReviewer();
  else if(e.key==='ArrowLeft')revStep(-1);
  else if(e.key==='ArrowRight')revStep(1);
});

function renderCards(){
  _renderSeq=0;
  var q=document.getElementById('search').value.toUpperCase().trim();
  var date=document.getElementById('dateSel').value;
  var terms=q?q.split(',').map(function(t){return t.trim();}).filter(function(t){return t;}):[];

  var pending=[], completed=[];
  allProjects.forEach(function(p){
    if(date && p.date!==date)return;
    var show=false;
    if(!terms.length)show=true;
    else for(var i=0;i<terms.length;i++){if(p.dx.indexOf(terms[i])>=0){show=true;break;}}
    if(!show)return;
    if(p.online_listed)completed.push(p);
    else pending.push(p);
  });

  currentPending=pending;
  DX_ORDER=pending.concat(completed).map(function(p){return p.dx;});
  document.getElementById('pendingGrid').innerHTML=pending.map(buildCard).join('')||'<p class="empty">暂无未上款数据</p>';
  document.getElementById('completedGrid').innerHTML=completed.map(buildCard).join('')||'<p class="empty">暂无已上款数据</p>';
  document.getElementById('pendingSection').style.display='block';
  document.getElementById('completedSection').style.display='block';
  document.getElementById('pendingSub').textContent='('+pending.length+')';
  document.getElementById('completedSub').textContent='('+completed.length+')';
  document.getElementById('emptyState').style.display=(pending.length+completed.length)?'none':'block';
  document.getElementById('cnt').textContent=(pending.length+completed.length)+' 款';
  bindPreview();
  updateUploadBtn();
}

function copyPendingSkus(){
  if(!currentPending.length){
    showToast('暂无未上款款号');
    return;
  }
  var list=currentPending.map(function(p){return p.dx;}).join(',');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(list).then(function(){
      showToast('✅ 已复制 '+currentPending.length+' 个未上款款号');
    }).catch(function(e){
      showToast('❌ 复制失败: '+e);
    });
  }else{
    // 兜底：用临时 textarea + execCommand
    var ta=document.createElement('textarea');
    ta.value=list;
    ta.style.position='fixed';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    try{
      document.execCommand('copy');
      showToast('✅ 已复制 '+currentPending.length+' 个未上款款号');
    }catch(e){
      showToast('❌ 复制失败: '+e);
    }
    document.body.removeChild(ta);
  }
}

var onlinePollTimer=null;
function startOnlinePolling(modeLabel){
  if(onlinePollTimer)clearInterval(onlinePollTimer);
  var btn=document.getElementById('refreshOnlineBtn');
  var deepBtn=document.getElementById('deepCleanBtn');
  // 记录刷新前的 online_updated_at，json 真正更新过才视为完成
  var prevUpdatedAt=(progressData&&progressData.online_updated_at)||'';
  var startTime=Date.now();
  var stableRounds=0;
  var updated=false;
  // quick 最长等 120s，deep 最长等 240s
  var maxWait=360000; // 统一6分钟，覆盖首次全量建库/深度清理最坏情况；正常增量几十秒即完成
  var label=(modeLabel==='deep')?'深度清理':'在线已上款刷新';
  onlinePollTimer=setInterval(function(){
    Promise.all([loadProjects(), loadProgress()]).then(function(){
      renderCards();
      updateProgressPanel();
      var curUpdatedAt=(progressData&&progressData.online_updated_at)||'';
      var now=Date.now();
      if(curUpdatedAt && curUpdatedAt!==prevUpdatedAt){
        updated=true;
        stableRounds++;
      }else if(updated){
        stableRounds++;
      }
      // json 已更新且再稳定 1 轮，或超过最大等待时间，都停止
      if((updated && stableRounds>=1) || (now-startTime)>maxWait){
        clearInterval(onlinePollTimer);onlinePollTimer=null;
        btn.disabled=false;btn.textContent='🌐 刷新已上款';
        if(deepBtn){deepBtn.disabled=false;deepBtn.textContent='🧹 深度清理';}
        showToast(updated?('✅ '+label+'完成'):'⚠️ 等待超时，请稍后点「🔄 刷新」查看结果');
      }
    });
  },3000);
}

function startPolling(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(function(){
    loadProgress().then(function(){
      renderCards();
      if(progressData && !progressData.running && progressData.pending && progressData.pending.length===0){
        clearInterval(pollTimer);pollTimer=null;
        showToast('✅ 上款任务完成');
        document.getElementById('uploadBtn').textContent='📤 批量上传 (0)';
        document.getElementById('uploadBtn').disabled=false;
      }
    });
  },2000);
}

function updateProgressPanel(){
  var panel=document.getElementById('progressPanel');
  if(!progressData || (!progressData.running && (!progressData.selected || !progressData.selected.length))){
    panel.classList.remove('active');
    return;
  }
  panel.classList.add('active');
  var total=progressData.total_count||0;
  var done=progressData.done_count||0;
  var fail=progressData.fail_count||0;
  var remain=total-done-fail;
  var pct=total?Math.round((done+fail)/total*100):0;
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('progressMeta').textContent='已上款 '+done+' / '+total+'  失败 '+fail+'  剩余 '+remain;

  var current=progressData.current;
  var currentText=current?'正在上款：'+current:'等待中…';
  document.getElementById('progressCurrent').textContent=currentText;

  var elapsed='-';
  if(progressData.started_at){
    var start=new Date(progressData.started_at).getTime();
    var now=Date.now();
    if(!isNaN(start))elapsed=formatDuration(Math.floor((now-start)/1000));
  }
  document.getElementById('progressElapsed').textContent='已用：'+elapsed;

  var avg='-', eta='-';
  if(progressData.per_dx){
    var times=[];
    Object.keys(progressData.per_dx).forEach(function(dx){
      var d=progressData.per_dx[dx];
      if(d.duration)times.push(d.duration);
    });
    if(times.length){
      var sum=times.reduce(function(a,b){return a+b;},0);
      avg=formatDuration(Math.round(sum/times.length));
      var remain=total-done;
      if(remain>0)eta=formatDuration(Math.round(sum/times.length*remain));
      else eta='0s';
    }
  }
  document.getElementById('progressAvg').textContent='平均：'+avg;
  document.getElementById('progressEta').textContent='预计剩余：'+eta;

  var onlineCount=progressData.online_count||0;
  var onlineUpdated=progressData.online_updated_at||'';
  var onlineText='在线已验证：'+onlineCount+' / '+total;
  if(onlineUpdated){
    var d=new Date(onlineUpdated);
    if(!isNaN(d)) onlineText+=' （更新于 '+d.toLocaleTimeString()+'）';
  }
  document.getElementById('progressOnline').textContent=onlineText;
}

function batchUpload(){
  var checked=document.querySelectorAll('.dx-check:checked');
  if(!checked.length){showToast('请先勾选需要上传的款');return;}
  var list=[];
  checked.forEach(function(cb){list.push(cb.getAttribute('data-dx'));});
  var force=document.getElementById('forceReupload').checked;
  var confirmMsg='批量上传 '+list.length+' 个款？\n将精确处理勾选的款号，不会继续后续款。';
  if(force) confirmMsg='【强制重新上款】\n将先从已上款记录中删除 '+list.length+' 个款，\n然后重新上款。是否继续？';
  if(!confirm(confirmMsg))return;
  var btn=document.getElementById('uploadBtn');
  btn.disabled=true;btn.textContent='⏳ 上传中…';
  showToast('⏳ 启动批量上传 '+list.length+' 款…');
  fetch(withCat('/api/batch-upload'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dx_list:list, force: force})})
    .then(function(r){return r.json();})
    .then(function(d){
      var msg=d.msg||d.error||JSON.stringify(d)||'未知错误';
      showToast(d.ok?'✅ '+msg:'❌ '+msg);
      if(d.ok){
        startPolling();
      }else{
        btn.textContent='📤 批量上传 (0)';btn.disabled=false;
      }
    }).catch(function(e){
      showToast('❌ 请求失败: '+e);
      btn.textContent='📤 批量上传 (0)';btn.disabled=false;
    });
}

// 悬停放大（改进：下方空间不足时显示在上方）
var prevEl=document.getElementById('preview');
var prevImg=document.getElementById('previewImg');
function bindPreview(){
  document.querySelectorAll('.up-thumb').forEach(function(cell){
    cell.addEventListener('mouseenter',function(e){
      var src=this.getAttribute('data-src');
      prevImg.src=src;
      prevEl.style.display='block';
      var r=this.getBoundingClientRect();
      var previewW=Math.min(900,window.innerWidth-40);
      var previewH=Math.min(window.innerHeight*0.85, window.innerHeight-40);
      var left=r.right+10, top=r.top;
      if(left+previewW>window.innerWidth-10) left=r.left-previewW-10;
      if(left<10) left=10;
      // 如果缩略图在屏幕下半部，预览图放上方
      if(r.top>window.innerHeight/2){
        top=r.bottom-previewH;
        if(top<10) top=10;
      }else{
        if(top+previewH>window.innerHeight-10) top=window.innerHeight-previewH-10;
        if(top<10) top=10;
      }
      prevEl.style.left=left+'px';prevEl.style.top=top+'px';
      prevEl.style.maxWidth=previewW+'px';
      prevEl.style.maxHeight=previewH+'px';
    });
    cell.addEventListener('mouseleave',function(){prevEl.style.display='none';});
  });
}
